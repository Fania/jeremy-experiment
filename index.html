<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jeremy Haslam</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  
<main>

  <img src="original.jpg" alt="">
  <svg id="jeremy_svg" viewBox="0 0 1000 1000" width="1000" height="1000" preserveAspectRatio="xMidYMid meet" overflow="hidden">
    <defs id="gradients">
      <linearGradient id="two_greens_fade">
        <stop offset="0%" stop-color="rgb(7, 70, 31)"/>
        <stop offset="100%" stop-color="rgb(22, 126, 32)"/>
      </linearGradient>
      <radialGradient id="gray_transparent_fade" cx="30%" cy="50%" r="120%">
        <stop offset="0%" stop-color="rgb(128, 154, 147)" stop-opacity="0.9"/>
        <stop offset="25%" stop-color="rgb(95, 108, 97)" stop-opacity="0.7"/>
        <stop offset="50%" stop-color="rgb(75, 90, 76)" stop-opacity="0.5"/>
        <stop offset="75%" stop-color="rgb(54, 92, 70)" stop-opacity="0.3"/>
        <stop offset="100%" stop-color="rgb(54, 92, 70)" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <g id="colour_blocks">
      <path id="shape_01" d="M 9 457 L 50 486 190 380 200 380 200 350 225 350 226 299 109 385 96 400 56 393  83 410 26 444 9 456" fill="url(#black_green_white_fade)"/>
      
    </g>
  </svg>
</main>

</html>
