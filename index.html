<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jeremy Haslam</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="scripts.js"></script>
  <script type="module" src="coords.js"></script>
</head>
<body>
  
<main>

  <img id="jeremy_img" src="original.jpg" alt="original" width="1227" height="1350">
  <section>

  </section>
  <svg id="jeremy_svg" viewBox="0 0 1227 1350" width="1227" height="1350" preserveAspectRatio="xMidYMid meet" overflow="hidden">
    <defs id="gradients">
      <linearGradient id="main_frame_fade"
                      gradientTransform="rotate(90)">
        <stop offset="0%" stop-color="rgb(208,246,243)" stop-opacity="0.5"/>
        <stop offset="50%" stop-color="rgb(209,214,202)" stop-opacity="0.5"/>
        <stop offset="100%" stop-color="rgb(208,246,243)" stop-opacity="1"/>
      </linearGradient>
      <linearGradient id="main_frame2_fade"
                      gradientTransform="rotate(0)">
        <stop offset="0%" stop-color="rgb(186,207,207)" stop-opacity="0.5"/>
        <stop offset="50%" stop-color="rgb(187,196,193)" stop-opacity="0.5"/>
        <stop offset="100%" stop-color="rgb(209,214,202)" stop-opacity="1"/>
      </linearGradient>

      <linearGradient id="main_frame_floor_fade">
        <stop offset="0%" stop-color="rgb(121,121,113)"/>
        <stop offset="15%" stop-color="rgb(195,210,203)"/>
        <stop offset="85%" stop-color="rgb(192,197,189)"/>
        <stop offset="100%" stop-color="rgb(121,127,120)"/>
      </linearGradient>
      <linearGradient id="main_frame_floor2_fade"
                      gradientTransform="rotate(90)">
        <stop offset="0%" stop-color="rgb(121,121,113)" stop-opacity="0"/>
        <stop offset="15%" stop-color="rgb(195,210,203)" stop-opacity="0"/>
        <stop offset="85%" stop-color="rgb(192,197,189)" stop-opacity="0"/>
        <stop offset="100%" stop-color="rgb(121,127,120)" stop-opacity="1"/>
      </linearGradient>

      <linearGradient id="main_frame_top_inner_fade">
        <stop offset="0%" stop-color="rgb(136,130,117)"/>
        <stop offset="15%" stop-color="rgb(176,191,188)"/>
        <stop offset="40%" stop-color="rgb(175,184,178)"/>
        <stop offset="80%" stop-color="rgb(168,177,174)"/>
        <stop offset="100%" stop-color="rgb(108,113,105)"/>
      </linearGradient>
      <linearGradient id="main_frame_left_inner_fade">
        <stop offset="0%" stop-color="rgb(117,116,111)"/>
        <stop offset="60%" stop-color="rgb(175,184,178)"/>
        <stop offset="100%" stop-color="rgb(176,191,188)"/>
      </linearGradient>
      <linearGradient id="main_frame_left_inner2_fade"
                      gradientTransform="rotate(90)">
        <stop offset="0%" stop-color="rgb(117,116,111)" stop-opacity="0.5"/>
        <stop offset="10%" stop-color="rgb(117,116,111)" stop-opacity="0"/>
        <stop offset="90%" stop-color="rgb(117,116,111)" stop-opacity="0"/>
        <stop offset="100%" stop-color="rgb(117,116,111)" stop-opacity="0.5"/>
      </linearGradient>
      <linearGradient id="main_frame_right_inner_fade">
        <stop offset="0%" stop-color="rgb(175,184,178)"/>
        <stop offset="60%" stop-color="rgb(168,177,174)"/>
        <stop offset="100%" stop-color="rgb(117,116,111)"/>
      </linearGradient>
      <linearGradient id="main_frame_right_inner2_fade"
                      gradientTransform="rotate(90)">
        <stop offset="0%" stop-color="rgb(117,116,111)" stop-opacity="0.5"/>
        <stop offset="30%" stop-color="rgb(117,116,111)" stop-opacity="0"/>
        <stop offset="60%" stop-color="rgb(117,116,111)" stop-opacity="0"/>
        <stop offset="100%" stop-color="rgb(117,116,111)" stop-opacity="0.5"/>
      </linearGradient>

      <linearGradient id="orange_block_top_left_fade"
                      gradientTransform="rotate(45)">
        <stop offset="0%" stop-color="rgb(168,24,5)"/>
        <stop offset="100%" stop-color="rgb(200,49,7)"/>
      </linearGradient>
      <linearGradient id="orange_block_left_fade">
        <stop offset="0%" stop-color="rgb(213,38,9)"/>
        <stop offset="100%" stop-color="rgb(239,54,8)"/>
      </linearGradient>
      <linearGradient id="orange_block_bottom_fade"
                      gradientTransform="rotate(100)">
        <stop offset="0%" stop-color="rgb(251,92,9)"/>
        <stop offset="100%" stop-color="rgb(230,40,8)"/>
      </linearGradient>
      <linearGradient id="orange_block_right_fade">
        <stop offset="40%" stop-color="rgb(246,93,10)"/>
        <stop offset="100%" stop-color="rgb(229,58,9)"/>
      </linearGradient>

      <pattern id="bottom_left_inner_shape_pattern"
                x="0" y="0" width=".111" height="1"
                patternTransform="rotate(315.65)"> 
        <rect x="0" y="0" width="225" height="275" fill="rgb(69,39,8)"></rect>
        <line x1="20" y1="0" x2="20" y2="275" stroke="rgb(204,229,236)" stroke-width="8"/>
        <line x1="10" y1="0" x2="10" y2="275" stroke="rgb(115,93,49)" stroke-width="8"/>
      </pattern>

      <filter id="inset_shadow">
        <feFlood flood-color="rgb(0,0,0,0.7)"/>
        <feComposite operator="out" in2="SourceGraphic" />
        <feMorphology operator="dilate" radius="10"/>
        <feGaussianBlur stdDeviation="10" />
        <feComposite operator="atop" in2="SourceGraphic"/>
      </filter>


      <!-- <radialGradient id="gray_transparent_fade" cx="30%" cy="50%" r="120%">
        <stop offset="0%" stop-color="rgb(128, 154, 147)" stop-opacity="0.9"/>
        <stop offset="25%" stop-color="rgb(95, 108, 97)" stop-opacity="0.7"/>
        <stop offset="50%" stop-color="rgb(75, 90, 76)" stop-opacity="0.5"/>
        <stop offset="75%" stop-color="rgb(54, 92, 70)" stop-opacity="0.3"/>
        <stop offset="100%" stop-color="rgb(54, 92, 70)" stop-opacity="0"/>
      </radialGradient> -->
    </defs>
    <g id="colour_blocks">

      <g id="frame">
        <rect id="main_frame" x="62" y="86" width="1105" height="1200" stroke-width="27" stroke="url(#main_frame_fade)" fill="none"></rect>
        <rect id="main_frame2" x="62" y="86" width="1105" height="1200" stroke-width="27" stroke="url(#main_frame2_fade)" fill="none"></rect>

        <!-- <rect id="main_frame_floor" x="75" y="100" width="1077" height="1172" fill="url(#main_frame_floor_fade)"></rect>
        <rect id="main_frame_floor2" x="75" y="100" width="1077" height="1172" fill="url(#main_frame_floor2_fade)"></rect> -->

        <polygon id="main_frame_top_inner" points="76,100 1152,100 1135,130 100,135" fill="url(#main_frame_top_inner_fade)"/>
        <polygon id="main_frame_left_inner" points="76,100 76,1272 100,1262 100,135" fill="url(#main_frame_left_inner_fade)"/>
        <polygon id="main_frame_left_inner2" points="76,100 76,1272 100,1262 100,135" fill="url(#main_frame_left_inner2_fade)"/>

        <polygon id="main_frame_right_inner" points="1152,100 1135,130 1130,1265 1152,1272" fill="url(#main_frame_right_inner_fade)"/>
        <polygon id="main_frame_right_inner2" points="1152,100 1135,130 1130,1265 1152,1272" fill="url(#main_frame_right_inner2_fade)"/>

        <polygon id="main_frame_bottom_inner" points="75,1272 1152,1272 1130,1265 100,1260" fill="rgb(99,95,89)"/>
      </g>

      <g id="orange_block">
        <polygon id="orange_block_top_left" points="762,887 824,909 915,833 952,810 904,828" fill="url(#orange_block_top_left_fade)"/>
        <polygon id="orange_block_middle" points="824,909 884,1027 1005,912 915,833" fill="rgb(251,91,9)"/>
        <polygon id="orange_block_left" points="762,887 875,1027 910,1055 910,1053 883,1026 824,909" fill="url(#orange_block_left_fade)"/>
        <polygon id="orange_block_bottom" points="883,1026 911,1054 1015,931 1005,912" fill="url(#orange_block_bottom_fade)"/>
        <polygon id="orange_block_right" points="915,833 1005,912 952,810" fill="url(#orange_block_right_fade)"/>
      </g>

      <path id="bottom_left_inner_shape" d="M 284,1014 Q 412,1135 568,1080 Q 560,955 445,860 Q 335,889 284,1014" fill="url(#bottom_left_inner_shape_pattern)" filter="url(#inset_shadow)"/>

    </g>
  </svg>
</main>
